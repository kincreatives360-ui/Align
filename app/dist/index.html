    <title>Create — Align</title>

    <!-- Paint with the saved theme before anything else renders, so there is no flash. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('ac-theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
