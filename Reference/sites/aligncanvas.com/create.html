<body>
<h1 class="sr-only">AlignCanvas: motion templates with 3D, liquid glass and blur for your images</h1>
<noscript>
  <main style="max-width:640px;margin:48px auto;padding:0 16px;font:16px/1.6 Inter,system-ui,sans-serif">
    <h2>AlignCanvas needs JavaScript</h2>
    <p>AlignCanvas turns your images into motion. Pick one of 100+ animated templates (3D carousels, rings, stacks, liquid glass and blur), drop in your images and export MP4, WebM, GIF, PNG or an image sequence. Everything renders in your browser, so your images stay on your device.</p>
    <p>Please enable JavaScript and use Chrome, Edge or a recent Safari.</p>
  </main>
</noscript>
<div class="app">
  <header class="top">
    <a class="brand" href="https://aligncanvas.com/" aria-label="AlignCanvas home">
      <img class="logo lt" src="brand/logo-on-light.svg" alt="AlignCanvas" width="1521" height="440">
      <img class="logo dk" src="brand/logo-on-dark.svg" alt="" width="1521" height="440">
      <span class="beta">Beta</span>
    </a>
    <div class="mid"><input id="projName" value="Untitled project" aria-label="Project name"><span class="savest" id="saveState" aria-live="polite"></span></div>
    <button class="ib ghost" id="undo" title="Undo (⌘Z)"></button>
    <button class="ib ghost" id="redo" title="Redo (⇧⌘Z)"></button>
    <div class="seg2" id="theme"><button data-v="light" title="Light theme"></button><button data-v="dark" title="Dark theme"></button></div>
    <button class="btn-primary" id="exportTop"></button>
    <button class="ib ghost acct" id="account">Sign in</button>
    <button class="ib ghost" id="help" title="Shortcuts">?</button>
  </header>
  <div class="body">
    <nav class="panel rail" id="rail"></nav>
    <aside class="panel" id="left"></aside>
    <main class="stage">
      <div class="toolbar" id="toolbar"></div>
      <div class="view" id="view">
        <div class="canvas-wrap" id="wrap"><canvas id="canvas"></canvas><div class="safe" id="safe"></div><div class="zones" id="zones" aria-hidden="true"><i class="zt"></i><i class="zb"></i><i class="zl"></i><i class="zr"></i></div></div>
      </div>
      <div class="timeline" id="timeline"></div>
      <button class="ib surprise" id="surprise" title="Surprise me (R)"></button>
    </main>
    <aside class="panel" id="right"></aside>
  </div>
</div>
<input type="file" id="fileImgs" accept="image/*,video/*" multiple hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
